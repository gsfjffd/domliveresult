name: Fully Automated Cricket Scraper

on:
  schedule:
    # Yeh automatically har 1 minute mein background mein chalega
    - cron: '* * * * *'
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests playwright
          playwright install chromium

      - name: Run main script
        run: python main.py
